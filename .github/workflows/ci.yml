name: CI

on:
  pull_request:
  push:
    branches:
      - "master"

# Superseded pull request runs are pointless; master runs are not, since each
# one publishes an image.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      # Cheapest first, so a formatting slip reports without waiting for a build.
      - run: cargo fmt --all --check

      # Order matters: the dev-profile artifacts `cargo test` leaves behind
      # satisfy clippy's check-profile fingerprints, so clippy only has to lint
      # this crate rather than rebuild the dependency graph.
      - run: cargo test --locked

      - run: cargo clippy --locked --all-targets -- -D warnings

  publish_image:
    name: Publish image
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: [check]
    if: github.ref == 'refs/heads/master'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Cache Docker layers
        uses: actions/cache@v6.1.0
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4.5.2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: docker_build
        uses: docker/build-push-action@v7
        with:
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/night-watch:latest
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache,mode=max

      - name: Image digest
        run: echo "$DIGEST"
        env:
          DIGEST: ${{ steps.docker_build.outputs.digest }}
